# The VU-meter FIFO must exist from boot, not from first playback.
#
# It used to be created by MPD's `fifo` audio_output at startup. That output is
# gone (see README-alsa-scope.md); the ALSA scope now mkfifo()s it instead — but
# only when MPD first opens the PCM. /tmp is a tmpfs, so between a reboot and the
# first track the node does not exist and the backend's spectrum reader retries
# every 2s, logging a failure each time. On a Pi that boots and sits idle that is
# an unbounded journal spam.
#
# Install: sudo cp stellar-spectrum-fifo.conf /etc/tmpfiles.d/
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/stellar-spectrum-fifo.conf
#
# Type `p` creates a FIFO if one does not already exist. The scope's mkfifo()
# tolerates EEXIST, so pre-creating it is safe.
p /tmp/mpd_spectrum.fifo 0666 mpd audio -
