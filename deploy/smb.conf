# Stellar appliance Samba configuration — canonical copy.
#
# Deployed at /etc/samba/smb.conf on the Pi (eduardo@stellar.local). This file is
# the version-controlled source of record; the appliance copy is the deployment.
# After editing: scp here, then
#   sudo install -m 0644 smb.conf /etc/samba/smb.conf
#   sudo testparm -s          # must parse clean before restarting
#   sudo systemctl restart smbd
#
# Two details are load-bearing and were both paid for in debugging time:
#
#  1. The vfs_fruit stack in [global] is REQUIRED. Without it the Finder cannot
#     paste into [Inbox] at all — macOS needs somewhere to put the AppleDouble
#     metadata, and Samba's answer is the fruit streams_xattr backend.
#
#  2. `veto files` in [Inbox] deliberately does NOT list /._*/. Vetoing the
#     AppleDouble sidecars makes the Finder ABORT THE WHOLE COPY when it tries
#     to write one, which presents as a mid-transfer failure with no useful
#     error. fruit:* handles them instead. Do not "tidy up" that list.
#
#  3. [Library] exists because the music library is NOT reachable through
#     [Music]. See the comment on that share — it is a wide-links problem, and
#     the share-per-real-path answer is deliberate over relaxing `wide links`.
#
# Reboot survival (verified 2026-10-19): nothing here needs a boot hook.
#   - smbd + nmbd are `systemctl enable`d (WantedBy=multi-user.target).
#   - /mnt/ssd comes from /etc/fstab by UUID (D43D-7F5C, ro,nofail,uid=mpd,
#     gid=audio,umask=022,x-systemd.device-timeout=10); systemd-fstab-generator
#     turns that into mnt-ssd.mount, WantedBy=local-fs.target.
#   - /etc/samba/smb.conf is a plain file on the ext4 root. Backup of the
#     pre-[Library] version: /etc/samba/smb.conf.bak-prelibrary-20261019.
#   NOTE the `nofail`: if the SSD is absent at boot the mount is skipped
#   silently and /mnt/ssd/Music does not exist, so smbd reports [Library] as
#   unavailable rather than serving an empty library. That is the failure mode
#   we want, but it means "the share vanished" should send you to the SSD first.
#
# See deploy/README-ingest.md and the 2026-10-17 / 2026-10-19 project notes.

[global]
# macOS interop (added 2026-10-17). Finder stores resource forks and Finder
# metadata either as SMB named streams or, if the server does not offer them,
# as ._ AppleDouble sidecar files. Samba offers the streams only via vfs_fruit.
# Without it Finder fell back to sidecars, the Inbox veto list refused them with
# NT_STATUS_OBJECT_NAME_NOT_FOUND, and the paste failed partway. With fruit the
# metadata lands in ext4 user xattrs and no junk file is ever created.
# Order matters: catia, fruit, streams_xattr.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = xattr
   fruit:nfs_aces = no
   fruit:zero_file_id = yes
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:delete_empty_adfiles = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
workgroup = WORKGROUP
server string = Stellar Audio Player
netbios name = stellar
wins support = no
dns proxy = no
log level = 0
security = user
map to guest = bad user
guest account = nobody

[Music]
path = /var/lib/mpd/music
browseable = yes
read only = yes
guest ok = yes

[Inbox]
   comment = Stellar ingest drop-box (staged, not the music library)
   path = /home/eduardo/inbox
   browseable = yes
   read only = no
   guest ok = no
   valid users = eduardo
   force user = eduardo
   force group = eduardo
   create mask = 0664
   directory mask = 0775
   veto files = /.DS_Store/.AppleDouble/.AppleDesktop/.Trashes/.fseventsd/.Spotlight-V100/__MACOSX/
   delete veto files = yes

# The music library itself. It is NOT reachable through [Music]: that share's
# path is /var/lib/mpd/music, where the library exists only as the symlink
# USB -> /mnt/ssd/Music. That target is outside the share root, which makes it
# a "wide link", and with the Samba defaults in force here (wide links = no,
# unix extensions = yes) Samba omits wide links from directory listings
# ENTIRELY — `cd USB` returns NT_STATUS_OBJECT_NAME_NOT_FOUND and the share
# looks like it simply has no library in it. MPD is unaffected; it follows the
# symlink itself.
#
# Rather than set `wide links = yes` + `unix extensions = no` (server-wide, and
# it lets any symlink inside a share reach anything smbd can read), this share
# points straight at the real path. No symlink, no security setting relaxed.
#
# Authenticated on purpose, NOT guest. macOS reuses a single SMB session per
# server, so a guest mount of any share on this box poisons the authenticated
# ones — that is the documented cause of "[Inbox] paste fails with a missing
# original item". Keeping every share the Mac actually uses on the same
# credentials avoids re-creating it.
#
# `veto files` is safe here precisely because this share is read only: the
# Finder-aborts-the-whole-copy trap documented for [Inbox] needs a write.
[Library]
   comment = Stellar music library (read-only, the real /mnt/ssd/Music)
   path = /mnt/ssd/Music
   browseable = yes
   read only = yes
   guest ok = no
   valid users = eduardo
   veto files = /._*/.DS_Store/.AppleDouble/.AppleDesktop/.Trashes/.fseventsd/.Spotlight-V100/__MACOSX/
