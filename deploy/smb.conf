# Stellar appliance Samba configuration — canonical copy.
#
# Deployed at /etc/samba/smb.conf on the Pi (eduardo@stellar.local). This file is
# the version-controlled source of record; the appliance copy is the deployment.
# After editing: scp here, then
#   sudo install -m 0644 smb.conf /etc/samba/smb.conf
#   sudo testparm -s          # must parse clean before restarting
#   sudo systemctl restart smbd
#
# Two details are load-bearing and were both paid for in debugging time:
#
#  1. The vfs_fruit stack in [global] is REQUIRED. Without it the Finder cannot
#     paste into [Inbox] at all — macOS needs somewhere to put the AppleDouble
#     metadata, and Samba's answer is the fruit streams_xattr backend.
#
#  2. `veto files` in [Inbox] deliberately does NOT list /._*/. Vetoing the
#     AppleDouble sidecars makes the Finder ABORT THE WHOLE COPY when it tries
#     to write one, which presents as a mid-transfer failure with no useful
#     error. fruit:* handles them instead. Do not "tidy up" that list.
#
# See deploy/README-ingest.md and the 2026-10-17 entries in the project notes.

[global]
# macOS interop (added 2026-10-17). Finder stores resource forks and Finder
# metadata either as SMB named streams or, if the server does not offer them,
# as ._ AppleDouble sidecar files. Samba offers the streams only via vfs_fruit.
# Without it Finder fell back to sidecars, the Inbox veto list refused them with
# NT_STATUS_OBJECT_NAME_NOT_FOUND, and the paste failed partway. With fruit the
# metadata lands in ext4 user xattrs and no junk file is ever created.
# Order matters: catia, fruit, streams_xattr.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = xattr
   fruit:nfs_aces = no
   fruit:zero_file_id = yes
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:delete_empty_adfiles = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
workgroup = WORKGROUP
server string = Stellar Audio Player
netbios name = stellar
wins support = no
dns proxy = no
log level = 0
security = user
map to guest = bad user
guest account = nobody

[Music]
path = /var/lib/mpd/music
browseable = yes
read only = yes
guest ok = yes

[Inbox]
   comment = Stellar ingest drop-box (staged, not the music library)
   path = /home/eduardo/inbox
   browseable = yes
   read only = no
   guest ok = no
   valid users = eduardo
   force user = eduardo
   force group = eduardo
   create mask = 0664
   directory mask = 0775
   veto files = /.DS_Store/.AppleDouble/.AppleDesktop/.Trashes/.fseventsd/.Spotlight-V100/__MACOSX/
   delete veto files = yes
